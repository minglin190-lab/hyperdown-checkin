# Hyperdown 每日自动签到（含 QQ 推送回调）
name: Hyperdown Check-in

on:
  workflow_dispatch:
  schedule:
    - cron: "35 16 * * *"

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run check-in and push
        env:
          HYPERDOWN_EMAIL: ${{ secrets.HYPERDOWN_EMAIL }}
          HYPERDOWN_PASSWORD: ${{ secrets.HYPERDOWN_PASSWORD }}
          NOTIFY_KEY: ${{ secrets.NOTIFY_KEY }}
        run: |
          set -uo pipefail
          output=$(python checkin.py 2>&1) || true
          echo "$output"
          if printf '%s' "$output" | grep -q '签到成功！本次奖励'; then
            date_str=$(printf '%s' "$output" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)
            gain=$(printf '%s' "$output" | grep -oE '奖励 [0-9.]+ GB' | tail -1 || true)
            bal=$(printf '%s' "$output" | grep -oE '余额 [0-9.]+ GB' | tail -1 || true)
            total=$(printf '%s' "$output" | grep -oE '累计签到流量 [0-9.]+ GB' | tail -1 || true)
            content="「${date_str}」签到成功！今日${gain}流量，${bal}，${total}"
            curl -s -X POST "https://grok200.de5.net/notify" -H "Content-Type: application/json" -d "$(python3 -c "import json,sys; print(json.dumps({'key': sys.argv[1], 'title': 'Hyperdown 每日签到', 'content': sys.argv[2]}))" "$NOTIFY_KEY" "$content")" || echo "推送失败（不影响签到）"
          elif printf '%s' "$output" | grep -q '今日已签到'; then
            echo "Worker 已在 00:05 签到，跳过推送"
          else
            echo "签到失败，触发 Worker 立即补签..."
            curl -s "https://grok200.de5.net/?cmd=checkin&key=${NOTIFY_KEY}" || true
          fi

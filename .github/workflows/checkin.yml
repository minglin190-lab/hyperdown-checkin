# Hyperdown 每日自动签到（含 QQ 推送回调）
name: Hyperdown Check-in

on:
  workflow_dispatch:
  schedule:
    - cron: "5 16 * * *"

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run check-in
        id: checkin
        env:
          HYPERDOWN_EMAIL: ${{ secrets.HYPERDOWN_EMAIL }}
          HYPERDOWN_PASSWORD: ${{ secrets.HYPERDOWN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${HYPERDOWN_EMAIL:-}" ] || [ -z "${HYPERDOWN_PASSWORD:-}" ]; then
            echo "::error::缺少 Secrets，需要配置 HYPERDOWN_EMAIL 和 HYPERDOWN_PASSWORD"
            exit 1
          fi
          output=$(python checkin.py 2>&1 || true)
          echo "$output"
          echo "RESULT<<EOF" >> "$GITHUB_ENV"
          echo "$output" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Push to QQ bot
        env:
          NOTIFY_KEY: ${{ secrets.NOTIFY_KEY }}
        run: |
          if [ -n "${NOTIFY_KEY:-}" ]; then
            log=$(echo "$RESULT")
            date_str=$(echo "$log" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)
            ok_line=$(echo "$log" | grep '本次奖励' | tail -1)
            total_line=$(echo "$log" | grep '累计签到' | tail -1)
            gain=$(echo "$ok_line" | grep -oE '奖励 [0-9.]+ GB')
            bal=$(echo "$ok_line" | grep -oE '余额 [0-9.]+ GB')
            total=$(echo "$total_line" | grep -oE '累计签到[^ ]* [0-9.]+ GB')
            content="「${date_str}」签到成功！
今日${gain}流量
当前${bal}，${total}"
            curl -s -X POST "https://grok200.de5.net/notify" \
              -H "Content-Type: application/json" \
              -d "$(python3 -c "import json,sys; print(json.dumps({'key': sys.argv[1], 'title': 'Hyperdown 每日签到', 'content': sys.argv[2]}))" "$NOTIFY_KEY" "$content")" \
              || echo "推送失败（不影响签到）"
          fi
